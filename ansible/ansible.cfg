[defaults]
inventory = inventory/hosts.yml
roles_path = roles
# OCI's Ubuntu images log in as "ubuntu".
remote_user = ubuntu
# The key from DEPLOY.md A5.
private_key_file = ~/.ssh/oracle-medical-records
interpreter_python = auto_silent
# Refuse a host whose SSH key changed, as plain ssh does.
host_key_checking = True
# Easier to read output.
stdout_callback = default
result_format = yaml
# Optional: put the vault password in a file OUTSIDE the repo (chmod 600) and uncomment, to skip --ask-vault-pass.
# vault_password_file = ~/.ansible/medical-records.vault-pass

[ssh_connection]
pipelining = True
