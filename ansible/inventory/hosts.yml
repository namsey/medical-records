---
# The VMs Ansible manages. The public IPs come from Terraform: `cd infra && terraform output`.
# SSH reaches them only from the addresses allowed in the security list (infra/main.tf, ssh_allowed_cidrs),
# so run Ansible from your laptop (or WSL on Windows), never from GitHub Actions.
all:
  hosts:
    staging:
      ansible_host: 203.0.113.10 # replace with the staging VM's public IP
    prod:
      ansible_host: 203.0.113.20 # replace with the prod VM's public IP
