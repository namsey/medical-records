---
# Grafana Cloud endpoints. None of these is a secret (the token is in vault.yml).
# Find them in grafana.com → My Account → your stack:
#   Prometheus → Details: "Remote Write Endpoint" and "Username / Instance ID"
#   Loki       → Details: URL (add /loki/api/v1/push) and "User"
alloy_grafana_cloud_prometheus_url: "https://prometheus-prod-XX-prod-REGION.grafana.net/api/prom/push"
alloy_grafana_cloud_prometheus_user: "1234567"
alloy_grafana_cloud_loki_url: "https://logs-prod-XXX.grafana.net/loki/api/v1/push"
alloy_grafana_cloud_loki_user: "1234567"

# The token, kept encrypted in vault.yml (docs/MONITORING.md step 4).
alloy_grafana_cloud_token: "{{ vault_grafana_cloud_token | default('') }}"
