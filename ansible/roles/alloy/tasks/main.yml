---
# Installs Grafana Alloy from Grafana's apt repository and configures it to push this VM's metrics and logs to
# Grafana Cloud (docs/MONITORING.md). Safe to run again: a second run changes nothing unless the config changed.

- name: Check the required settings are filled in
  ansible.builtin.assert:
    that:
      - alloy_env in ["staging", "prod"]
      - alloy_grafana_cloud_prometheus_url is match("https://")
      - alloy_grafana_cloud_prometheus_user | string | length > 0
      - alloy_grafana_cloud_loki_url is match("https://")
      - alloy_grafana_cloud_loki_user | string | length > 0
      - alloy_grafana_cloud_token | length > 0
    fail_msg: >-
      Fill in alloy_env (host_vars), the alloy_grafana_cloud_* URLs and users (group_vars/all/main.yml) and
      vault_grafana_cloud_token (group_vars/all/vault.yml, encrypted). See docs/MONITORING.md steps 3-4.
    quiet: true

- name: Install python3-debian (Ansible needs it to manage apt repository files)
  ansible.builtin.apt:
    name: python3-debian
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Add Grafana's apt repository and its signing key (/etc/apt/sources.list.d/grafana.sources)
  ansible.builtin.deb822_repository:
    name: grafana
    types: [deb]
    uris: https://apt.grafana.com
    suites: [stable]
    components: [main]
    signed_by: https://apt.grafana.com/gpg.key
    state: present
  register: alloy_grafana_repo

- name: Install Alloy {{ alloy_version }}
  ansible.builtin.apt:
    name: "alloy={{ alloy_version }}"
    state: present
    update_cache: true
    # Refresh the package list right away when the repository was just added, otherwise at most once an hour.
    cache_valid_time: "{{ 0 if alloy_grafana_repo is changed else 3600 }}"
  notify: Restart alloy

- name: Check whether Alloy is installed yet
  ansible.builtin.stat:
    path: /usr/bin/alloy
  register: alloy_binary

# In --check mode on a VM that does not have Alloy yet, nothing was installed, so the alloy user, its group and
# the alloy command do not exist: the rest would fail for that reason only. A real run always has them.
- name: Explain why the configuration steps are skipped
  ansible.builtin.debug:
    msg: "Check mode: Alloy is not installed yet, so its configuration is not previewed. A real run installs and configures it."
  when: not alloy_binary.stat.exists

- name: Configure and start Alloy
  when: alloy_binary.stat.exists
  block:
    - name: Let Alloy read the systemd journal (the app's and Caddy's logs are there)
      ansible.builtin.user:
        name: alloy
        groups: systemd-journal
        append: true
      notify: Restart alloy

    - name: Write Alloy's settings and the Grafana Cloud token (/etc/default/alloy)
      ansible.builtin.template:
        src: alloy.default.j2
        dest: /etc/default/alloy
        owner: root
        group: alloy
        mode: "0640"
      no_log: true # contains the token
      notify: Restart alloy

    - name: Write Alloy's configuration (checked with alloy validate before it replaces the old one)
      ansible.builtin.template:
        src: config.alloy.j2
        dest: /etc/alloy/config.alloy
        owner: root
        group: alloy
        mode: "0640"
        validate: /usr/bin/alloy validate %s
      notify: Restart alloy

    - name: Start Alloy now and at every boot
      ansible.builtin.systemd_service:
        name: alloy
        enabled: true
        state: started

- name: Apply a pending restart before checking Alloy
  ansible.builtin.meta: flush_handlers

- name: Wait until Alloy reports it is ready
  ansible.builtin.uri:
    url: "http://{{ alloy_listen_address }}/-/ready"
    status_code: 200
  register: alloy_ready
  until: alloy_ready.status == 200
  retries: 12
  delay: 5
  when: alloy_binary.stat.exists and not ansible_check_mode
