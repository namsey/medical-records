# Log rotation (#45): caps the system journal, which holds the app's and the backup's logs.
# Install: sudo install -D -m 644 deploy/journald/medical-records.conf /etc/systemd/journald.conf.d/medical-records.conf
#          sudo systemctl restart systemd-journald
# The app never logs record contents, search terms or file names.
[Journal]
SystemMaxUse=500M
SystemKeepFree=2G
MaxRetentionSec=1month
