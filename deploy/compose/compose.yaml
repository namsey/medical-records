# What both VMs run (ctr-2): the app image behind Caddy, which serves HTTPS for SITE_DOMAIN.
#
# On the VMs this folder is installed to /opt/medical-records/compose by scripts/host-setup.sh, next to a .env with
# APP_IMAGE, DATA_DIR, SITE_DOMAIN, SITE_ALIASES and APP_MEMORY_LIMIT, and run through medical-records-compose
# (DEPLOY.md B6).
# The deploy agent sets APP_IMAGE (always <registry>/<namespace>/medical-records/app@sha256:<digest>, never a
# tag). DATA_DIR must be owned by 10001:10001. The app's settings and secrets come from /etc/medical-records/app.env.
# APP_ENV_FILE, CLAMAV_RUN_DIR and BACKUP_STATUS_HOST_DIR exist for local tests only; the VMs use the defaults.

name: medical-records

services:
  app:
    image: ${APP_IMAGE:?set APP_IMAGE to the image digest reference}
    env_file: ${APP_ENV_FILE:-/etc/medical-records/app.env}
    environment:
      # These win over app.env: the data lives on the volume, and only Caddy may set the client IP.
      DATABASE_URL: sqlite:////data/medical_records.db
      FILES_DIR: /data/files
      UPLOAD_DIR: /data/uploads
      FORWARDED_ALLOW_IPS: 172.30.0.10
      # Inside the container "/" is the image, not the VM disk; only the data disk is checked.
      SYSTEM_DISK_PATH: ""
    volumes:
      - ${DATA_DIR:?set DATA_DIR to the data folder on the VM}:/data
      # The host's clamd socket (prod: CLAMAV_SOCKET=/run/clamav/clamd.ctl, DEPLOY.md C6). systemd creates it with
      # mode 666 and only replaces the socket file on a restart, so mounting the folder keeps it reachable.
      - ${CLAMAV_RUN_DIR:-/run/clamav}:/run/clamav:ro
      # last-success / last-failure written by the backup timer (prod: BACKUP_STATUS_DIR, same path inside).
      - ${BACKUP_STATUS_HOST_DIR:-/var/lib/medical-records-backup}:/var/lib/medical-records-backup:ro
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: ${APP_MEMORY_LIMIT:-1g}
    # Longer than SHUTDOWN_GRACE_SECONDS (30), so uploads still running can finish before the kill.
    stop_grace_period: 40s
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    # To the journal (capped by deploy/journald/medical-records.conf), so logs survive recreating the container:
    # journalctl -t medical-records-app, or medical-records-compose logs app.
    logging:
      driver: journald
      options:
        tag: medical-records-app
    networks:
      web:
        ipv4_address: 172.30.0.20

  caddy:
    image: caddy:2.11.7@sha256:504a44d7d74bd2bc28a66afc4774912fc21223ca8a67734af1c54ab2f999b489
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN, e.g. records.example.com}
      # Optional names that only redirect to SITE_DOMAIN (prod: the www name), space-separated.
      SITE_ALIASES: ${SITE_ALIASES:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped
    logging:
      driver: journald
      options:
        tag: medical-records-caddy
    networks:
      web:
        # The app trusts X-Forwarded-For only from this address (FORWARDED_ALLOW_IPS above).
        ipv4_address: 172.30.0.10

networks:
  web:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  caddy_data:
  caddy_config:
